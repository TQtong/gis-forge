<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>2.5D terrain regression</title><link rel="icon" href="data:,">
<style>html,body,#map{width:100%;height:100%;margin:0;overflow:hidden}</style></head>
<body><div id="map"></div><script type="module">
import { Map25D } from '/src/packages/preset-25d/src/map-25d.ts';
const map = new Map25D({ container: document.getElementById('map'), center: [115.96, 40.46], zoom: 11, pitch: 65, bearing: 0, maxPitch: 85 });
map.addSource('osm', { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, maxzoom: 19 });
map.addLayer({ id: 'imagery', type: 'raster', source: 'osm' });
map.addSource('elevation', { type: 'cesium-terrain', url: 'https://sooncps.xwbuilders.com/api/ugis-dataprocess/v1/terrain/NhBLlMx3/' });
map.addLayer({ id: 'terrain', type: 'cesium-terrain', source: 'elevation', paint: { 'terrain-exaggeration': 1.8, 'terrain-ambient': 0.15 } });
window.map = map;
await map.ready();
window.mapReady = true;
</script></body></html>
